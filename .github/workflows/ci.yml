name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests integrations/slime/prepare_assets.py integrations/slime/reproduce.py integrations/slime/prepare_adapter.py integrations/slime/verify_adapter.py integrations/slime/capture_local_model.py integrations/slime/verify_sglang.py integrations/slime/test_live_runner.py integrations/transformers
      - run: uv build
  controlled-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked --extra qwen --python 3.12
      - run: uv run --no-sync python integrations/slime/prepare_assets.py .cache/qwen3-0.6b
      - run: uv run --no-sync python integrations/slime/reproduce.py --assets .cache/qwen3-0.6b --output artifacts/qwen3
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-conversion-evidence
          path: artifacts/qwen3/
  collector-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked --extra qwen --extra slime-adapter --python 3.12
      # CPU-only test dependency avoids downloading a CUDA runtime or model weights.
      - run: uv pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest tests/test_transformers_capture.py -q
      - run: uv run --no-sync python integrations/slime/prepare_adapter.py .cache/slime-adapter
      - run: uv run --no-sync python integrations/slime/verify_adapter.py --source .cache/slime-adapter --output artifacts/slime-adapter
      # Scripted transport contract only: this step does not execute SGLang.
      - run: uv run --no-sync python integrations/slime/test_live_runner.py --source .cache/slime-adapter --output artifacts/live-runner-contract
      - uses: actions/upload-artifact@v4
        with:
          name: slime-adapter-evidence
          path: |
            artifacts/slime-adapter/
            artifacts/live-runner-contract/
