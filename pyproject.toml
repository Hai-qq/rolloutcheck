[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rolloutcheck"
version = "0.1.0a7"
description = "Offline history-token contract checks and reproducible conversion cases for LLM rollouts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hai-qq"}]
dependencies = []

[project.optional-dependencies]
qwen = ["transformers==4.57.6", "jinja2==3.1.6"]
generation = ["torch==2.10.0", "transformers==4.57.6", "jinja2==3.1.6"]

slime-adapter = ["aiohttp>=3.12,<4", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
rolloutcheck = "rolloutcheck.cli:main"

[project.urls]
Repository = "https://github.com/Hai-qq/rolloutcheck"
Issues = "https://github.com/Hai-qq/rolloutcheck/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
